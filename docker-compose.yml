# Production: backend only (no frontend). No published ports, no bind-mounted source, no --reload.
# Secrets come from ./.env (gitignored; template: .env.example). Telegram is the only UI.
#   docker compose up -d --build      # start / update
#   docker compose logs -f backend    # logs (rotated: 5 × 10 MB)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - trade-data:/app/data          # SQLite journal/cache only (exchange is the source of truth)
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # /api/health returns 503 when the live engine's reconcile loop is stale
      test: [".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s

volumes:
  trade-data:
