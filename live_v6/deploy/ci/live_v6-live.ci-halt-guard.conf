# /etc/systemd/system/live_v6-live.service.d/10-ci-halt-guard.conf — TA R2.
# After a CI halt (ci_deploy.sh stop_and_alert writes /opt/tradebot/app/CI_HALTED) the live bot must not start again
# by itself (Restart=always, reboot) or by a casual `systemctl start`, until ops has investigated and removed
# CI_HALTED by hand. Installed with `systemctl daemon-reload` only — it takes effect at the NEXT start of the unit; the
# running process is not touched. "+" = runs as root outside the sandbox. Does not touch orders or exchange stops.
[Service]
ExecStartPre=+/bin/sh -c 'if [ -e /opt/tradebot/app/CI_HALTED ]; then echo "CI_HALTED present - start refused; ops must remove it by hand:"; cat /opt/tradebot/app/CI_HALTED; exit 1; fi'
